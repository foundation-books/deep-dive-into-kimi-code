[project]
name = "deep-dive-into-kimi-code"
version = "0.1.0"
description = "Dependency-free companion code for Deep Dive into Kimi K3."
authors = [{ name = "Yin Yang" }]
maintainers = [{ name = "Foundation Books Project" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.quality]
optional = true

[tool.poetry.group.quality.dependencies]
mypy = "==1.14.1"
ruff = "==0.15.5"

[tool.ruff.lint]
extend-select = [
    "B",
    "C901",
    "PLW1510",
    "PLW2901",
    "PGH003",
    "RUF007",
    "RUF059",
    "RUF100",
    "S102",
    "S112",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
mypy_path = ["computational_anatomy"]
# The repair exercise copies this intentionally defective learner-visible program.
exclude = [
    "^(?:.*/)?test_.+\\.py$",
    "^unified_agentic_environments_task_synthesis/fixtures/analysis\\.py$",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
